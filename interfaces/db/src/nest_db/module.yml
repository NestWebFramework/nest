#
# db — the database interface.
#
# Modules depend on this and on SQLAlchemy sessions. An application binds it
# to one engine provider (db-sqlite, db-postgres, db-mariadb); changing the
# database is changing that binding, never module code.
#
module:
  name: db
  id: nest.interface.db
  type: interface
  title: Database
  version: 0.1.0
  description: >
    A relational database behind SQLAlchemy: sessions, the engine for
    migrations, the dialect and its capabilities, and a health check.
  license: MIT
  created: "2026-11-13"

interface:
  name: nest.db
  protocol: "nest_db:Database"

provides:
  import: nest_db
  exports: [Database, SqlDatabase, model_base, NAMING_CONVENTION]

docs:
  title: Database
  section: interfaces
