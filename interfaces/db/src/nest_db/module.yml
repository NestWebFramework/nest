#
# db — the database interface.
#
# Modules depend on this and on SQLAlchemy sessions. An application binds it
# to one engine provider (db-sqlite, db-postgres, db-mariadb); changing the
# database is changing that binding, never module code.
#
module:
  name: db
  id: nest.interface.db
  type: interface
  title: Database
  version: 0.2.0
  description: >
    A relational database behind SQLAlchemy: sessions, the engine for
    migrations, the dialect and its capabilities, and a health check.
  license: MIT
  created: "2026-11-13"

# the nest-core versions it works with (a registry refuses a package without)
nest: ">=0.2,<1"

interface:
  name: nest.db
  protocol: "nest_db:Database"

# Migrates (or checks) every module that declares db.migrations, before any
# module is set up. NEST_MIGRATE=auto|check|off; see nest_db/migrate.py.
startup: "nest_db.migrate:on_startup"
# a module uninstalled from the application: its tables go with it
forget: "nest_db.migrate:on_forget"

provides:
  import: nest_db
  exports: [Database, SqlDatabase, model_base, NAMING_CONVENTION, Dump, build_url, require_driver,
            text_table, text_rows, localize, by_slug, save_text, delete_text, text_state, Localized,
            overlay, Overlaid, pending_migrations]

docs:
  title: Database
  section: interfaces
