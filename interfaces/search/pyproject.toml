[project]
name = "nest-search"
version = "0.1.0"
description = "The nest.search interface: full-text search over what modules index."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["markupsafe>=2.1"]

[project.entry-points."nest.modules"]
search = "nest_search"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
