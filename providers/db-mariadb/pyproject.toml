[project]
name = "nest-db-mariadb"
version = "0.1.0"
description = "MariaDB (and MySQL) as a provider of nest.db, through PyMySQL."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nest-db", "pymysql>=1.1"]

[project.entry-points."nest.modules"]
db-mariadb = "nest_db_mariadb"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
