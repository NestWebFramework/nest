#
# db-mariadb — MariaDB (and MySQL) as nest.db, through PyMySQL.
#
# PyMySQL is pure Python: no client library to install. Connections use
# utf8mb4 (all of Unicode, Romanian diacritics included), UTC, and a strict
# SQL mode, so a value that does not fit is an error rather than truncated.
# Connections are recycled before the server's idle timeout closes them.
#
module:
  name: db-mariadb
  id: nest.provider.db-mariadb
  type: provider
  title: MariaDB
  version: 0.1.0
  description: MariaDB or MySQL through PyMySQL, utf8mb4, strict mode, UTC, pooled.
  license: MIT
  created: "2026-11-13"

main: nest_db_mariadb
implements: [nest.db]

deps:
  db: ">=0.1,<1"

settings:
  url:
    type: str
    secret: true
    description: A whole URL (mariadb://user:password@host:port/database); wins over the parts.
  host:
    type: str
    default: 127.0.0.1
  port:
    type: int
    default: 3306
  database:
    type: str
  user:
    type: str
  password:
    type: str
    secret: true
  flavour:
    type: str
    default: mariadb
    choices: [mariadb, mysql]
    description: Which server it is; SQLAlchemy compiles a few things differently.
  ssl_ca:
    type: str
    description: A CA file to verify the server with; TLS is used when set.
  pool_size:
    type: int
    default: 5
  max_overflow:
    type: int
    default: 5
  pool_recycle:
    type: int
    default: 280
    description: Seconds before a pooled connection is replaced (below the server's wait_timeout).
