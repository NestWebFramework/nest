[project]
name = "nest-db-postgres"
version = "0.1.0"
description = "PostgreSQL as a provider of nest.db, through psycopg 3."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nest-db", "psycopg[binary]>=3.2"]

[project.entry-points."nest.modules"]
db-postgres = "nest_db_postgres"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
