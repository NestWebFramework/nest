[project]
name = "nest-redis"
version = "0.1.0"
description = "Redis (or Valkey) as a provider of nest.cache and nest.pubsub."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nest-cache", "nest-pubsub", "redis>=5.0,<9"]

[project.entry-points."nest.modules"]
redis = "nest_redis"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
