#
# redis — Redis (or Valkey, the same protocol) as nest.cache and nest.pubsub.
#
# One server for every worker of nest serve and every machine that runs the
# application: what one worker stores (a sign-in limit's count) the others see, and
# what one publishes (a forum post, a message) reaches visitors on all of them.
# The address is a secret, from the environment:
#   NEST_<APP>__REDIS__URL=redis://:password@cache.lan:6379/0
# Every key and channel is prefixed with the application's name, so applications can
# share one server.
#
module:
  name: redis
  id: nest.provider.redis
  type: provider
  title: Redis
  version: 0.1.0
  description: Redis or Valkey through redis-py's asyncio client, shared by every worker.
  license: MIT
  created: "2026-11-19"

main: nest_redis
implements: [nest.cache, nest.pubsub]

deps:
  cache: ">=0.2,<1"
  pubsub: ">=0.1,<1"

settings:
  url:
    type: str
    secret: true
    required: true
    description: redis://[:password@]host:port/db (rediss:// for TLS).
  prefix:
    type: str
    default: ""
    description: Put before every key and channel; the application's name when empty.
  timeout:
    type: float
    default: 2.0
    description: Seconds to wait for the server before a request fails.
  max_connections:
    type: int
    default: 20
    description: Connections each worker keeps open at most.
