[project]
name = "nest-search-sqlite"
version = "0.1.0"
description = "SQLite FTS5 as a provider of nest.search: an index file in the workspace."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nest-search"]

[project.entry-points."nest.modules"]
search-sqlite = "nest_search_sqlite"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
