[project]
name = "nest-workspace"
version = "0.4.7"
description = "Nest 0.4.7, the workspace: the core, its modules, interfaces, providers, themes and applications."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "nest-core",
    "nest-htmx",
    "nest-theme-base",
    "nest-theme-paper",
    "nest-theme-slate",
    "nest-cache",
    "nest-cache-memory",
    "nest-pubsub",
    "nest-redis",
    "nest-db",
    "nest-db-sqlite",
    "nest-db-postgres",
    "nest-db-mariadb",
    "nest-auth",
    "nest-forms",
    "nest-search",
    "nest-search-sqlite",
    "nest-storage",
    "nest-storage-local",
    "nest-storage-s3",
    "nest-content",
    "nest-media",
    "nest-gallery",
    "nest-maps",
    "nest-notifications",
    "nest-seo",
    "nest-translations",
    "nest-comments",
    "nest-redirects",
    "nest-geo",
    "nest-docs",
    "nest-admin",
    "nest-agent",
    "nest-scheduler",
    "nest-keeper",
    "nest-registry",
    "nest-forum",
    "nest-messages",
    "nest-consent",
    "nest-pwa",
    "nest-push",
    "nest-rating",
    "nest-keys",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/*",
    "modules/*",
    "interfaces/*",
    "providers/*",
    "themes/*",
]

[tool.uv.sources]
nest-core = { workspace = true }
nest-htmx = { workspace = true }
nest-theme-base = { workspace = true }
nest-theme-paper = { workspace = true }
nest-theme-slate = { workspace = true }
nest-cache = { workspace = true }
nest-cache-memory = { workspace = true }
nest-redis = { workspace = true }
nest-pubsub = { workspace = true }
nest-db = { workspace = true }
nest-db-sqlite = { workspace = true }
nest-db-postgres = { workspace = true }
nest-db-mariadb = { workspace = true }
nest-auth = { workspace = true }
nest-forms = { workspace = true }
nest-search = { workspace = true }
nest-search-sqlite = { workspace = true }
nest-storage = { workspace = true }
nest-storage-local = { workspace = true }
nest-storage-s3 = { workspace = true }
nest-content = { workspace = true }
nest-media = { workspace = true }
nest-gallery = { workspace = true }
nest-maps = { workspace = true }
nest-notifications = { workspace = true }
nest-seo = { workspace = true }
nest-translations = { workspace = true }
nest-comments = { workspace = true }
nest-redirects = { workspace = true }
nest-geo = { workspace = true }
nest-docs = { workspace = true }
nest-admin = { workspace = true }
nest-agent = { workspace = true }
nest-scheduler = { workspace = true }
nest-keeper = { workspace = true }
nest-registry = { workspace = true }
nest-forum = { workspace = true }
nest-messages = { workspace = true }
nest-consent = { workspace = true }
nest-pwa = { workspace = true }
nest-push = { workspace = true }
nest-rating = { workspace = true }
nest-keys = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["packages/nest-core/tests", "tests"]
addopts = "-q"
filterwarnings = [
    # Starlette 1.x nudges toward a successor of httpx for its TestClient; httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as argument defaults.
extend-immutable-calls = ["nest.bound", "nest.bind.bound", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["nest"]
