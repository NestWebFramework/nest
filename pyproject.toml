[project]
name = "nest-workspace"
version = "0.0.0"
description = "The Nest workspace: the core, its modules, interfaces, providers, themes and applications."
requires-python = ">=3.12"
dependencies = [
    "nest-core",
    "nest-htmx",
    "nest-theme-base",
    "nest-cache",
    "nest-cache-memory",
    "nest-db",
    "nest-db-sqlite",
    "nest-db-postgres",
    "nest-db-mariadb",
    "nest-auth",
    "nest-forms",
    "nest-search",
    "nest-search-sqlite",
    "nest-glossary",
    "nest-storage",
    "nest-storage-local",
    "nest-content",
    "nest-media",
    "nest-gallery",
    "nest-comments",
    "nest-redirects",
    "nest-admin",
    "nest-keeper",
    "nest-forum",
    "nest-messages",
    "nest-trains",
    "nest-game",
    "nest-game-world",
    "nest-game-item",
    "nest-game-inventory",
    "nest-game-character",
    "nest-game-settlement",
    "nest-game-building",
    "nest-game-npc",
    "nest-game-production",
    "nest-game-economy",
    "nest-game-map",
    "nest-game-household",
    "nest-game-law",
    "nest-content-voievodate",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/*",
    "modules/*",
    "interfaces/*",
    "providers/*",
    "themes/*",
    "game/engine",
    "game/subsystems/*",
    "game/content/*",
]

[tool.uv.sources]
nest-core = { workspace = true }
nest-htmx = { workspace = true }
nest-theme-base = { workspace = true }
nest-cache = { workspace = true }
nest-cache-memory = { workspace = true }
nest-db = { workspace = true }
nest-db-sqlite = { workspace = true }
nest-db-postgres = { workspace = true }
nest-db-mariadb = { workspace = true }
nest-auth = { workspace = true }
nest-forms = { workspace = true }
nest-search = { workspace = true }
nest-search-sqlite = { workspace = true }
nest-glossary = { workspace = true }
nest-storage = { workspace = true }
nest-storage-local = { workspace = true }
nest-content = { workspace = true }
nest-media = { workspace = true }
nest-gallery = { workspace = true }
nest-comments = { workspace = true }
nest-redirects = { workspace = true }
nest-admin = { workspace = true }
nest-keeper = { workspace = true }
nest-forum = { workspace = true }
nest-messages = { workspace = true }
nest-trains = { workspace = true }
nest-game = { workspace = true }
nest-game-world = { workspace = true }
nest-game-item = { workspace = true }
nest-game-inventory = { workspace = true }
nest-game-character = { workspace = true }
nest-game-settlement = { workspace = true }
nest-game-building = { workspace = true }
nest-game-npc = { workspace = true }
nest-game-production = { workspace = true }
nest-game-economy = { workspace = true }
nest-game-map = { workspace = true }
nest-game-household = { workspace = true }
nest-game-law = { workspace = true }
nest-content-voievodate = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["packages/nest-core/tests", "tests"]
addopts = "-q"
filterwarnings = [
    # Starlette 1.x nudges toward a successor of httpx for its TestClient; httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as argument defaults.
extend-immutable-calls = ["nest.bound", "nest.bind.bound", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["nest"]
