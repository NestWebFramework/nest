[project]
name = "nest-workspace"
version = "0.4.1"
description = "Nest 0.4.1, the workspace: the core, its modules, interfaces, providers, themes and applications."
requires-python = ">=3.12"
dependencies = [
    "nest-core",
    "nest-htmx",
    "nest-theme-base",
    "nest-theme-paper",
    "nest-theme-slate",
    "nest-theme-morlaca-valley",
    "nest-theme-morlaca-heritage",
    "nest-theme-morlaca-chronicle",
    "nest-theme-rail-signage",
    "nest-cache",
    "nest-cache-memory",
    "nest-pubsub",
    "nest-redis",
    "nest-db",
    "nest-db-sqlite",
    "nest-db-postgres",
    "nest-db-mariadb",
    "nest-auth",
    "nest-forms",
    "nest-search",
    "nest-search-sqlite",
    "nest-glossary",
    "nest-storage",
    "nest-storage-local",
    "nest-storage-s3",
    "nest-content",
    "nest-media",
    "nest-gallery",
    "nest-maps",
    "nest-notifications",
    "nest-seo",
    "nest-translations",
    "nest-comments",
    "nest-redirects",
    "nest-hangman",
    "nest-feed",
    "nest-geo",
    "nest-docs",
    "nest-admin",
    "nest-agent",
    "nest-scheduler",
    "nest-keeper",
    "nest-registry",
    "nest-forum",
    "nest-messages",
    "nest-trains",
    "nest-transit",
    "nest-consent",
    "nest-theme-transit-lines",
    "nest-saga",
    "nest-saga-world",
    "nest-saga-item",
    "nest-saga-inventory",
    "nest-saga-character",
    "nest-saga-settlement",
    "nest-saga-building",
    "nest-saga-npc",
    "nest-saga-production",
    "nest-saga-economy",
    "nest-saga-map",
    "nest-saga-household",
    "nest-saga-law",
    "nest-saga-religion",
    "nest-saga-relationship",
    "nest-saga-dialogue",
    "nest-saga-guild",
    "nest-saga-quest",
    "nest-saga-chronicle",
    "nest-saga-player",
    "nest-saga-travel",
    "nest-saga-society",
    "nest-saga-farm",
    "nest-saga-equipment",
    "nest-saga-polity",
    "nest-saga-justice",
    "nest-saga-war",
    "nest-saga-overlord",
    "nest-saga-culture",
    "nest-saga-property",
    "nest-saga-monastery",
    "nest-saga-survival",
    "nest-saga-history",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/*",
    "modules/*",
    "interfaces/*",
    "providers/*",
    "themes/*",
    "engines/saga",
    "engines/saga/subsystems/*",
]

