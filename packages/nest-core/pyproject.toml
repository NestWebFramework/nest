[project]
name = "nest-core"
version = "0.2.0"
description = "Nest: a lightweight, manifest-driven host for web applications."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "packaging>=24.0",
    "python-multipart>=0.0.12",
]


[project.scripts]
nest = "nest.cli:main"

[project.entry-points."nest.contracts"]
core = "nest.contract:CORE_CONTRACT"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nest"
