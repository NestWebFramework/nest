<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How a Nest application is made</title>
  <desc id="d">An application's module.yml names its modules and theme; modules need interfaces; providers implement them.</desc>
  <rect width="860" height="470" rx="14" fill="#f7f8fa"/>
  <!-- theme -->
  <rect x="40" y="24" width="780" height="54" rx="10" fill="#fff4d6" stroke="#e0b44a"/>
  <text x="430" y="49" text-anchor="middle" font-size="17" font-weight="700" fill="#5a4310">Theme</text>
  <text x="430" y="68" text-anchor="middle" font-size="13" fill="#7a6020">layout, look, settings: base, paper, slate</text>
  <!-- application -->
  <rect x="40" y="98" width="780" height="70" rx="10" fill="#12355b"/>
  <text x="430" y="128" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Application · module.yml</text>
  <text x="430" y="151" text-anchor="middle" font-size="13" fill="#cfe0f2">which modules, where, with which settings · bindings · theme · languages</text>
  <!-- modules -->
  <g font-size="14" text-anchor="middle">
    <rect x="40" y="196" width="780" height="104" rx="10" fill="#e8f0fb" stroke="#9bb8dd"/>
    <text x="430" y="218" font-size="15" font-weight="700" fill="#12355b">Modules</text>
    <g fill="#fff" stroke="#9bb8dd">
      <rect x="60" y="232" width="110" height="50" rx="8"/><rect x="185" y="232" width="110" height="50" rx="8"/><rect x="310" y="232" width="110" height="50" rx="8"/>
      <rect x="435" y="232" width="110" height="50" rx="8"/><rect x="560" y="232" width="110" height="50" rx="8"/><rect x="685" y="232" width="115" height="50" rx="8"/>
    </g>
    <g fill="#12355b"><text x="115" y="262">content</text><text x="240" y="262">gallery</text><text x="365" y="262">forum</text><text x="490" y="262">maps</text><text x="615" y="262">comments</text><text x="742" y="262">admin · auth …</text></g>
  </g>
  <text x="430" y="322" text-anchor="middle" font-size="12.5" fill="#556">they need interfaces, and ask each other through lookups (host.answer / host.lookup): never import each other</text>
  <!-- interfaces -->
  <rect x="40" y="336" width="380" height="56" rx="10" fill="#eef7ee" stroke="#93c493"/>
  <text x="230" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#1e5a1e">Interfaces</text>
  <text x="230" y="380" text-anchor="middle" font-size="13" fill="#2f6f2f">nest.db · nest.search · nest.storage · nest.cache</text>
  <!-- providers -->
  <rect x="440" y="336" width="380" height="56" rx="10" fill="#f6eef7" stroke="#c39ac8"/>
  <text x="630" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#5a1e63">Providers (bound by the application)</text>
  <text x="630" y="380" text-anchor="middle" font-size="13" fill="#6f2f78">db-sqlite · db-postgres · search-sqlite · storage-s3 · redis</text>
  <path d="M420 364 H440" stroke="#888" stroke-width="2"/>
  <!-- host -->
  <rect x="40" y="410" width="780" height="40" rx="10" fill="#2b2f36"/>
  <text x="430" y="436" text-anchor="middle" font-size="14" fill="#e6e8eb">nest-core: the host (plans, checks, serves) · FastAPI · migrations per module · workspace on disk</text>
</svg>
