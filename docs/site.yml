  - title: Developing modules
    pages: [develop/a-module, develop/manifest, develop/lookups, develop/database, develop/scheduling, develop/templates-and-assets, develop/security, develop/testing, registry]
  - title: Running sites
    pages: [operate/overview, deploy, deploy-ispconfig, registry-deploy, operate/backups-and-upgrades, operate/keeper, operate/agent-status]
  - title: Modules
    reference: modules
  - title: Themes
    reference: themes
  - title: Providers
    reference: providers
  - title: Interfaces
    reference: interfaces
