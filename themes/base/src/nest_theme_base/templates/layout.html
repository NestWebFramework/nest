<!doctype html>
<html lang="{% block lang %}en{% endblock %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ app.title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ asset('base', 'nest.css') }}">
  {% include "htmx/head.html" %}
  {% block head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container bar">
      {% block header %}<a class="brand" href="/">{{ app.title }}</a>{% endblock %}
      <nav aria-label="Main">{% block nav %}{% endblock %}</nav>
    </div>
  </header>
  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container">{% block footer %}{{ app.title }}{% endblock %}</div>
  </footer>
</body>
</html>
