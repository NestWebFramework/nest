#
# base — the theme every scaffolded application starts with.
#
# One stylesheet (no framework, no build), system fonts, light and dark from
# the browser's preference, readable from a 320px phone to a wide screen.
# Layout blocks: title, head, header, nav, content, footer.
#
module:
  name: base
  id: nest.theme.base
  type: theme
  title: Base theme
  version: 0.2.4
  description: A responsive, dependency-free layout and stylesheet for Nest applications.
  license: MIT
  created: "2026-11-13"
  category: look
  fits: [any]

# the nest-core versions it works with (a registry refuses a package without)
nest: ">=0.2,<1"

main: nest_theme_base

deps:
  htmx: ">=0.1,<1"

locales:
  - {locale: ro, file: locales/ro.json}

  - {locale: en, file: locales/en.json}
docs:
  title: Base theme
  section: themes

styles: [nest.css]

# the colours its card in the admin panel's Themes page shows
preview: {bg: "#f8f7f4", surface: "#ffffff", text: "#1d1c1a", muted: "#5f5b53", accent: "#8a2b1f", border: "#dedad0"}

# the menus it shows, by their address (Admin → Content → Menus)
menus:
  - {name: main, title: Main menu}

# where its pages have room for blocks (Themes → Regions)
regions:
  - {name: home, title: Home page, description: "Under the home page's own content."}
  - {name: after_content, title: Under every page, description: "Under each page's content."}
  - {name: footer, title: Footer, description: "In the footer, on every page."}
