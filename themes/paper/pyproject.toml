[project]
name = "nest-theme-paper"
version = "0.1.3"
description = "The Paper theme for Nest, built on the base theme."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nest-theme-base"]

[project.entry-points."nest.modules"]
paper = "nest_theme_paper"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
