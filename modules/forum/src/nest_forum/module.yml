#
# forum — boards, topics and posts, reusable by any application.
#
# Reading is public unless public_read is off; posting is for members. A board may
# have a scope ("voievodate/settlement:12"): it is not listed, and only those the
# application lets in (its answer to forum.access) read or post there; others get a 404.
# Another module makes such a board when it is first wanted (lookup forum.board). A new
# reply is pushed over SSE (topic family forum.topic.*) to everyone reading
# its topic; without JavaScript the form posts and the page reloads at the new
# post. Posts are plain text. Moderators pin, lock and hide; authors edit for
# edit_minutes. Members may post posts_per_minute at most.
#
module:
  name: forum
  id: nest.module.forum
  type: module
  title: Forum
  version: 0.2.0
  description: Boards, topics and posts with moderation, editing, and replies that arrive live.
  license: MIT
  created: "2026-11-13"
  category: community
  fits: [site, game]
# the nest-core versions it works with (a registry refuses a package without)
nest: ">=0.2,<1"

main: nest_forum
styles: [forum.css]  # its base look; an application restyles it

provides:
  import: nest_forum
  exports: []

requires:
  host: [realtime]
  interfaces: [nest.db]

deps:
  db: ">=0.2,<1"
  auth: ">=0.3,<1"
  htmx: ">=0.1,<1"

db:
  migrations: migrations
  metadata: "nest_forum.models:Base"

settings:
  public_read: {type: bool, default: true, description: Whether people who have not signed in may read.}
  edit_minutes: {type: int, default: 30, description: How long an author may edit a post.}
  posts_per_page: {type: int, default: 30}
  topics_per_page: {type: int, default: 30}
  posts_per_minute: {type: int, default: 5, description: Posts a member may send per minute.}
  public_names:
    type: str
    default: known_as
    choices: [known_as, account]
    description: "The names posts show on public boards: known_as (as the application names its people: a game, by their characters) or account (the account's own name). Boards with a scope always use known_as."

locales:
  - {locale: ro, file: locales/ro.json}

  - {locale: en, file: locales/en.json}
docs:
  title: Forum
  section: modules

admin:
  group: community
  title: Forum
  order: 22
  role: moderator
  description: "The boards, their topics and posts."

# how a site reaches it without code: a menu link, shortcodes, blocks for a theme's regions
offers:
  menu: {title: "Forum", path: "/"}
  blocks:
    - {name: latest, title: "Latest forum topics", template: forum/block_latest.html, description: "The topics with the newest replies.", settings: {count: "How many (5 by default)"}}
