[project]
name = "nest-rating"
version = "0.1.1"
description = "Stars, useful-or-not and up/down votes on any module's records, anonymous and one per visitor."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nest-core>=0.4.6", "nest-db>=0.2"]

[project.entry-points."nest.modules"]
rating = "nest_rating"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
