#
# rating — visitors judge what a page offers, three ways:
#   stars    ★★★★☆ 4.2 (37)          places and services: operators, stations, airports
#   helpful  "Was this useful? Yes/No" articles, documentation, a timetable's correctness
#   updown   ▲ 12 ▼ 3                 things compared with each other: entries, posts
#
# A page embeds {{ rating("coaches.operator:flixbus", "stars", name="FlixBus") }}; the form
# carries the subject signed, so nobody can vote on one a page did not offer. Any module
# reads the summaries ("rating.summary", "rating.summaries") to show or sort by them.
#
# Votes are anonymous (the sites have no visitor accounts): one per visitor and subject,
# changeable, by a random voter id in a cookie (necessary for the vote the visitor asks
# for, declared to the consent module), and a daily hash of the address and browser so
# clearing the cookie does not give a second vote. A signed-in visitor votes as themselves.
# An average shows only from `min_votes` votes. Nothing about the voter is kept but those
# two ids (no address, no browser string).
#
module:
  name: rating
  id: nest.module.rating
  type: module
  title: Ratings
  version: 0.1.1
  description: Stars, useful-or-not and up/down votes on any module's records, anonymous and one per visitor.
  license: MIT
  created: "2026-11-24"
  category: community
  fits: [site, game]

nest: ">=0.4.6,<1"

main: nest_rating
styles: [rating.css]

requires:
  interfaces: [nest.db]

deps:
  db: ">=0.2,<1"

db:
  migrations: migrations
  metadata: "nest_rating.models:Base"

provides:
  import: nest_rating
  exports: []

settings:
  min_votes:
    type: int
    default: 5
    description: Votes a subject needs before its average (or share of yes) is shown; fewer, the count only.
  per_minute:
    type: int
    default: 10
    description: Votes one address may give in a minute (beyond, it is asked to wait).
  schema:
    type: bool
    default: true
    description: Write the stars of a subject in schema.org terms (AggregateRating) where a page asks it, for search engines.

admin:
  title: Ratings
  group: Community
  order: 45

locales:
  - {locale: ro, file: locales/ro.json}
  - {locale: en, file: locales/en.json}

docs:
  title: Ratings
  section: modules
