[project]
name = "nest-scheduler"
version = "0.1.0"
description = "Jobs at set times or intervals, declared in the packages' manifests: run once across the workers, remembered across restarts, in the admin panel."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nest-core", "nest-db", "nest-auth", "nest-admin"]

[project.entry-points."nest.modules"]
scheduler = "nest_scheduler"

[project.entry-points."nest.commands"]
scheduler = "nest_scheduler.cli:register"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
