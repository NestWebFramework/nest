[project]
name = "nest-gallery"
version = "0.1.0"
description = "Photo galleries and albums: pages, embeds, a lightbox, and WordPress gallery imports."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nest-core", "nest-db", "nest-storage", "nest-media"]

[project.entry-points."nest.modules"]
gallery = "nest_gallery"

[project.entry-points."nest.commands"]
gallery = "nest_gallery.cli:register"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
