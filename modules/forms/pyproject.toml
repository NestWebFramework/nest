[project]
name = "nest-forms"
version = "0.1.1"
description = "Forms for Nest: Pydantic validation, translated messages, accessible fields."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nest-core"]

[project.entry-points."nest.modules"]
forms = "nest_forms"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
