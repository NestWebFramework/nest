#
# keys — accounts without email or password (GDPR: no credential kept that could be used).
#
# A site's own first step makes the account (a game, as the character is named:
# keys.starter), signed in on that browser for a year (sliding). The player keeps it with a
# passkey (fingerprint, face, the device's PIN or password; synced by Apple, Google,
# Microsoft) or with its key, downloaded as a small file (a link and its code; kept as its
# SHA-256), and comes back on any device with either. Accounts never kept go after
# unprotected_days without play, all after inactive_days; the modules holding their data
# hear account.forget first.
#
module:
  name: keys
  id: nest.module.keys
  type: module
  title: Keys and devices
  version: 0.2.0
  description: Accounts without email or password - kept by a passkey or a downloaded key, on any device.
  license: MIT
  created: "2026-11-25"
  category: admin
  fits: [site, game]

nest: ">=0.4.7,<1"

main: nest_keys
styles: [keys.css]

requires:
  interfaces: [nest.db]

deps:
  auth: ">=0.5,<1"
  db: ">=0.2,<1"

db:
  migrations: migrations
  metadata: "nest_keys.models:Base"

provides:
  import: nest_keys
  exports: [start_account, key_link, TooMany]

settings:
  play:
    type: str
    default: "/"
    description: Where "Start playing" goes (the site's first step, where the account is made; a game's character page).
  after:
    type: str
    default: "/"
    description: Where a device goes once signed in by its key or a passkey.
  device_days:
    type: int
    default: 365
    description: A device stays signed in this many days without use (sliding).
  new_accounts_per_day:
    type: int
    default: 3
    description: New accounts one address may make in a day (no email makes them free; this keeps scripts out).
  unprotected_days:
    type: int
    default: 14
    description: An account kept by neither a passkey nor a downloaded key goes after this many days without use (with its data in the other modules).
  inactive_days:
    type: int
    default: 365
    description: Any account without email goes after this many days without use (GDPR, storage limitation).

schedule:
  - name: cleanup
    run: nest_keys.jobs:cleanup
    every: 24h
    catch_up: once
    description: Remove the accounts unused too long (never protected after unprotected_days, any after inactive_days), telling the modules holding their data.

locales:
  - {locale: ro, file: locales/ro.json}
  - {locale: en, file: locales/en.json}

docs:
  title: Keys and devices
  section: modules
