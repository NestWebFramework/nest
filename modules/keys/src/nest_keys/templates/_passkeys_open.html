<div class="keys-passkeys" data-passkeys data-base="{{ base }}" data-csrf="{{ csrf_token }}"
     data-msg-refused="{{ _('The device did not confirm. Try again, or come back with your key.') }}"
     data-msg-cancelled="{{ _('Cancelled.') }}"
     data-msg-unknown="{{ _('This passkey belongs to no character here (it may have been removed). Use your key.') }}"
     data-msg-expired="{{ _('It took too long. Try again.') }}"
     data-msg-known="{{ _('This device already protects your character.') }}"
     data-msg-wait="{{ _('Too many tries. Wait a few minutes.') }}">
