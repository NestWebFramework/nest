[project]
name = "nest-keys"
version = "0.1.0"
description = "Accounts without email or password: a device's session, the account's key (a link), passkeys and a device PIN."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nest-core>=0.4.7", "nest-db>=0.2", "nest-auth>=0.5", "segno>=1.6", "webauthn>=2.5,<4"]

[project.entry-points."nest.modules"]
keys = "nest_keys"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
