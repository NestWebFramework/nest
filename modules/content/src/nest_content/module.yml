#
# content — the CMS: typed entries, taxonomies, menus and media.
#
# Content types are YAML, declared by any package and by the application
# (which wins); a field's value is validated by its declared type and kept in
# the entry's JSON. An entry's address comes from its type's path template and
# is stored, so a page is found by its path and a moved site keeps its URLs.
# Bodies are HTML, sanitized on every save (nh3); shortcodes are expanded when
# a page is shown. Files live in nest.storage. WordPress sites come in with
# `nest content import-wordpress`.
#
module:
  name: content
  id: nest.module.content
  type: module
  title: Content
  category: content
  version: 0.1.0
  description: >
    Pages, posts and any declared content type with custom fields; categories
    and tags; menus; media in nest.storage; revisions; search; a WordPress
    importer that keeps the old addresses.
  license: MIT
  created: "2026-11-13"

# the nest-core versions it works with (a registry refuses a package without)
nest: ">=0.2,<1"

main: nest_content
styles: [content.css]  # its base look; an application restyles it

provides:
  import: nest_content
  exports: [KIND, EntryData, Registry, shortcode]

requires:
  interfaces: [nest.db, nest.search, nest.storage]

deps:
  db: ">=0.2,<1"
  search: ">=0.1,<1"
  storage: ">=0.1,<1"
  media: ">=0.1,<1"
  auth: ">=0.2,<1"

db:
  migrations: migrations
  metadata: "nest_content.models:Base"

# Its records' text in every language of the site (text tables, one row per language);
# with the translations module, editors write the other languages beside the original.
# A translated slug makes the translated address, /en/category/did-you-know/; a page not
# yet translated shows the original's text at its English address.
uses: [translations]
translatable:
  entry:
    model: "nest_content.models:EntryText"
    label: Articles and pages
    fields: {title: text, slug: slug, excerpt: textarea, body: html}
    edit: "{admin}/content/entries/{id}"
  term:
    model: "nest_content.models:TermText"
    label: Categories and tags
    fields: {name: text, slug: slug, description: textarea}
    edit: "{admin}/content/terms/{id}"
  menu_item:
    model: "nest_content.models:MenuItemText"
    label: Menu labels
    fields: {title: text, url: text}

# The WordPress set. An application declares its own, or redeclares these.
content_types:
  post:
    title: Posts
    path: "/{category}/{slug}/"
    taxonomies: [category, post_tag]
  page:
    title: Pages
    path: "/{path}/"
    hierarchical: true

taxonomies:
  category:
    title: Categories
    hierarchical: true
    path: "/category/{path}/"
  post_tag:
    title: Tags
    path: "/tag/{slug}/"

settings:
  home:
    label: Home page
    type: str
    default: ""
    description: The path of the entry shown at /; empty shows the latest entries.
  per_page:
    label: Entries per page
    type: int
    default: 10
  media_max_mb:
    label: Largest upload (MB)
    type: int
    default: 10
    description: The largest picture an editor may upload, in MB.
  trash_days:
    label: Days in the trash
    type: int
    default: 30
    description: How long a deleted entry waits in the trash before it is deleted for good (0 keeps it).
  site_url:
    label: Public address
    type: str
    default: ""
    description: >
      The address the public uses (https://example.org), for the absolute links of the
      sitemap, the feed and what a shared page shows; empty takes the request's.

# Videos play from YouTube's cookieless player, and only when a reader plays one.
csp:
  frame-src: [https://www.youtube-nocookie.com]

locales:
  - {locale: ro, file: locales/ro.json}

  - {locale: en, file: locales/en.json}
docs:
  title: Content
  section: modules

admin:
  title: Content
  order: 10
  role: editor
  description: Pages, articles and their categories; menus.
