[project]
name = "nest-keeper"
version = "0.2.3"
description = "The keeper: the deployed sites Nest watches through their agents, and Nest's applications, their plans and packages."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nest-core", "nest-auth", "nest-admin", "nest-db"]

[project.entry-points."nest.modules"]
keeper = "nest_keeper"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[project.entry-points."nest.commands"]
keeper = "nest_keeper.cli:register"
