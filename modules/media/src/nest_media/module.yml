#
# media — the files in nest.storage, served.
#
# Content, galleries and anything else that stores files link to them through
# this module, mounted where the application says (/media by convention, which
# imported pages assume). A stored file is never a page of the site: HTML and
# SVG are sent as sandboxed attachments; everything is cacheable for a week.
# A picture asked for with ?w=640 is made that wide (WebP) once and kept.
#
module:
  name: media
  id: nest.module.media
  type: module
  title: Media
  version: 0.1.1
  description: >
    Serves stored files with safe headers, pictures at the widths pages need, and gives
    templates media_url(key, width) and media_srcset(key).
  license: MIT
  created: "2026-11-13"
  category: media
  fits: [any]

# the nest-core versions it works with (a registry refuses a package without)
nest: ">=0.2,<1"

main: nest_media

provides:
  import: nest_media
  exports: [media_base, media_url, media_srcset, responsive_images, forget_sizes, SIZES, clean_image, ImageError]

requires:
  interfaces: [nest.storage]

deps:
  storage: ">=0.1,<1"

# what it tells an editor whose picture it refuses, in each language
locales:
  - {locale: ro, file: locales/ro.json}
  - {locale: en, file: locales/en.json}
