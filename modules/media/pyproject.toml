[project]
name = "nest-media"
version = "0.1.0"
description = "Serves the files in nest.storage, safely, for every module that stores them."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nest-core", "nest-storage"]

[project.entry-points."nest.modules"]
media = "nest_media"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
