[project]
name = "nest-notifications"
version = "0.1.0"
description = "Toast messages for Nest: after redirects, in htmx answers, from page scripts."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nest-core"]

[project.entry-points."nest.modules"]
notifications = "nest_notifications"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
