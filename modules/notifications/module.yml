#
# notifications — toasts: a short message for the person who just did something.
#
# A module says ``toast(request, _("Saved."))`` (from nest) whatever it answers next.
# This module carries it there: after a redirect, in a signed cookie the next page
# reads once; in an htmx answer, in its HX-Trigger header, shown at once. A page's
# scripts say one with window.nest.toast(text, level). Every layout holds the region
# ({% include "notifications/region.html" ignore missing %}), a polite live region,
# so a screen reader reads each message too. Without this module, toasts are dropped.
#
module:
  name: notifications
  id: nest.module.notifications
  type: module
  title: Notifications
  category: interface
  version: 0.1.0
  description: >
    Toast messages (saved, deleted, sent, failed) after redirects, htmx answers and from
    page scripts; signed, read once, accessible, restyled by the application.
  license: MIT
  created: "2026-11-19"

main: nest_notifications
pages: false  # it serves no page of its own: included without a route
styles: [toasts.css]  # its base look; an application restyles it

provides:
  import: nest_notifications
  exports: [ToastMiddleware]

locales:
  - {locale: ro, file: locales/ro.json}

docs:
  title: Notifications
  section: modules
