{#- The admin panel's menu, in either frame. -#}
    <nav class="admin-nav" aria-label="{{ _('Admin panel') }}">
      <a href="{{ admin_root or '' }}/"{% if request.url.path.rstrip('/') == (admin_root or '') %} aria-current="page"{% endif %}>{{ _("Overview") }}</a>
      {% if user and user.has("admin") %}<a href="{{ admin_root }}/settings"{% if request.url.path.startswith((admin_root or '') ~ '/settings') %} aria-current="page"{% endif %}>{{ _("Settings") }}</a>
      <a href="{{ admin_root }}/modules"{% if request.url.path.startswith((admin_root or '') ~ '/modules') %} aria-current="page"{% endif %}>{{ _("Modules") }}</a>
      <a href="{{ admin_root }}/languages"{% if request.url.path.startswith((admin_root or '') ~ '/languages') %} aria-current="page"{% endif %}>{{ _("Languages") }}</a>
      <a href="{{ admin_root }}/themes"{% if request.url.path.startswith((admin_root or '') ~ '/themes') %} aria-current="page"{% endif %}>{{ _("Themes") }}</a>{% endif %}
      {% for p in admin_nav %}<a href="{{ p.base }}/"{% if request.url.path.startswith(p.base) %} aria-current="page"{% endif %}>{{ p.title }}</a>{% endfor %}
    </nav>
