[project]
name = "nest-admin"
version = "0.2.3"
description = "The admin panel: one shell gathering the admin pages of every module an application includes."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nest-core", "nest-auth"]

[project.entry-points."nest.modules"]
admin = "nest_admin"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
