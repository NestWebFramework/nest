#
# redirects — old addresses sent on to new ones, reusable by any application.
#
# A redirect answers only when nothing else did, so an existing page always
# wins. Targets are a path on this site or an http(s) address; a chain that
# would loop is refused when it is added; 410 says a page is gone for good.
# Editors manage them where the application mounts the module
# (/admin/redirects by convention); hits show which old links are still used.
#
module:
  name: redirects
  id: nest.module.redirects
  type: module
  title: Redirects
  category: seo
  version: 0.1.0
  description: Old addresses sent on to new ones, with hit counts, an editor and CSV imports.
  license: MIT
  created: "2026-11-13"

main: nest_redirects

provides:
  import: nest_redirects
  exports: [service]

requires:
  interfaces: [nest.db]

deps:
  db: ">=0.2,<1"
  auth: ">=0.2,<1"

db:
  migrations: migrations
  metadata: "nest_redirects.models:Base"

locales:
  - {locale: ro, file: locales/ro.json}

docs:
  title: Redirects
  section: modules
