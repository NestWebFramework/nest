#
# redirects — old addresses sent on to new ones, reusable by any application.
#
# A redirect answers only when nothing else did, so an existing page always
# wins. Targets are a path on this site or an http(s) address; a chain that
# would loop is refused when it is added; 410 says a page is gone for good.
# Editors manage them in the admin panel (<admin route>/redirects); hits show
# which old links are still used. A whole folder moves with a prefix rule in any
# manifest: redirect_prefixes: {/wp-content/uploads/: /media/uploads/}.
#
module:
  name: redirects
  id: nest.module.redirects
  type: module
  title: Redirects
  version: 0.1.1
  description: Old addresses sent on to new ones, with hit counts, an editor and CSV imports.
  license: MIT
  created: "2026-11-13"
  category: seo
  fits: [site, game]
# the nest-core versions it works with (a registry refuses a package without)
nest: ">=0.2,<1"

main: nest_redirects

provides:
  import: nest_redirects
  exports: [service]

requires:
  interfaces: [nest.db]

deps:
  db: ">=0.2,<1"
  auth: ">=0.2,<1"

db:
  migrations: migrations
  metadata: "nest_redirects.models:Base"

locales:
  - {locale: ro, file: locales/ro.json}

  - {locale: en, file: locales/en.json}
docs:
  title: Redirects
  section: modules

admin:
  group: site
  title: Redirects
  order: 80
  role: editor
  description: Old addresses sent on to new ones, and how often they are still used.
