[project]
name = "nest-redirects"
version = "0.1.1"
description = "Old addresses sent on to new ones: a table, a fallback, an editor."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["nest-core", "nest-db", "nest-auth"]

[project.entry-points."nest.modules"]
redirects = "nest_redirects"

[project.entry-points."nest.commands"]
redirects = "nest_redirects.cli:register"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
