#
# auth — accounts, sign-in and server-side sessions.
#
# Passwords are hashed with the standard library's scrypt. The browser holds a
# random session token; the database holds only its SHA-256. Sign-in is
# throttled per email and address, counted in a shared cache (redis) when
# the application binds one, else in the database, so every worker agrees; ?next= goes only to a path on this site.
# Registration is closed unless allowed, except for the very first account,
# which becomes the administrator.
#
module:
  name: auth
  id: nest.module.auth
  type: module
  title: Accounts
  version: 0.5.0
  description: >
    Accounts with roles, sign-in and sign-out, server-side sessions on the
    bound database, and the dependencies other modules protect routes with.
  license: MIT
  created: "2026-11-13"
  category: admin
  fits: [any]

# the nest-core versions it works with (a registry refuses a package without)
nest: ">=0.2,<1"

main: nest_auth

provides:
  import: nest_auth
  exports: [CurrentUser, current_user, require_user, require_role, hash_password, verify_password, find_user, find_person, known_as, users_by_ids, active_user, create_keyless, sign_in, session_token, token_id, close_session, close_all_sessions, close_session_id, sessions_of, SessionInfo, keyless_accounts, remove_account, make_throttle]

requires:
  interfaces: [nest.db]

deps:
  db: ">=0.2,<1"
  htmx: ">=0.1,<1"

db:
  migrations: migrations
  metadata: "nest_auth.models:Base"

settings:
  after_register:
    type: str
    default: "/"
    description: Where a new account goes once made (a page of the site, a path); a game sends it to its play page.
  allow_registration:
    label: Allow registration
    type: bool
    default: false
    description: "Whether anyone may create an account on the site. Off: only accounts made by an administrator (the first account always may, to make the site's administrator)."
  session_days:
    restart: true
    type: int
    default: 14
    description: A session ends after this many days without use.
  min_password_length:
    type: int
    default: 10
  login_attempts:
    restart: true
    type: int
    default: 5
    description: Failed sign-ins allowed per email and address before a pause.
  lockout_minutes:
    restart: true
    type: int
    default: 15
    description: How long a pause lasts (an account, an address, an email from one address).
  account_attempts:
    restart: true
    type: int
    default: 3
    description: Wrong passwords allowed for one account, from any address, before it is paused (an unknown email is counted the same, so a pause says nothing of which accounts exist).
  address_attempts:
    restart: true
    type: int
    default: 20
    description: Failed sign-ins allowed from one address, to any accounts, before it is paused.
  registrations_per_hour:
    restart: true
    type: int
    default: 5
    description: Accounts one address may try to create in an hour.

locales:
  - {locale: ro, file: locales/ro.json}

  - {locale: en, file: locales/en.json}
docs:
  title: Accounts
  section: modules

admin:
  group: site
  title: Accounts
  order: 90
  role: admin
  description: Who has an account, their roles, and whether it is active.
