# nginx in front of the Nest registry (plain nginx). With ISPConfig, ISPConfig owns the vhost:
# paste the location block below into the site's "nginx Directives" instead (see
# docs/registry-deploy.md); the TLS certificate is ISPConfig's Let's Encrypt one.

server {
    listen 443 ssl http2;
    server_name registry.nest-framework.org;

    ssl_certificate     /etc/letsencrypt/live/registry.nest-framework.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registry.nest-framework.org/privkey.pem;

    # at least the registry's max_upload_mb (50 by default), or nginx refuses an upload the
    # registry would take
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8600;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;   # an upload streams through
    }
}

server {
    listen 80;
    server_name registry.nest-framework.org;
    return 301 https://$host$request_uri;
}
