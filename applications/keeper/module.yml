#
# keeper — Nest's own application: it watches the deployed sites (Nest sites
# through their agents, other services with a web check), restarts and upgrades
# them through the host helper, and shows the applications Nest knows, their
# plans and packages. One person's: run your own (deploy/DEPLOY.md).
#
module:
  name: keeper
  id: nest.app.keeper
  type: application
  title: Nest keeper
  version: 0.2.0
  description: Watches the deployed sites, restarts and upgrades them, and shows Nest's applications.
  license: MIT
  created: "2026-11-14"

application:
  type: keeper  # what it is: the packages offered to it are those made for it
  title: Nest keeper
  port: 8000
  theme: base
  languages: [ro, en]

modules:
  - name: keeper
    route: /
    # nest's own applications, and those in repos of their own beside it
    config: {apps: "applications,../voievodate,../gari,../morlaca,../regionalisme,../transilpedia"}
  - name: admin
    route: /admin
  - name: auth
    route: /cont
  - name: scheduler  # the keeper's checks and clean-ups (keeper.watch, keeper.prune)

bind:
  nest.db:
    providers: [db-sqlite]
